<style>
/* 헤드라인 전용 부리체 — 마루 부리(네이버, 무료) */

:root{--green:#1F4D33;--green-dark:#123023;--ink:#111814;--gray:#6b746e;--bg:#fff;--bg-soft:#F4F6F3;--line:#E4E8E3;--kakao:#FEE500}
/* 한글 모바일 기본값 — 어절 단위 줄바꿈 + 긴 영문은 예외적으로 끊기 */
body{word-break:keep-all;overflow-wrap:break-word}
html{-webkit-text-size-adjust:100%}
/* 제목 줄바꿈은 브라우저가 균형 배분 — 폭마다 <br>가 어긋나던 문제 해결
   (ch는 숫자 0 기준이라 한글에 부정확 → em 사용) */
h1,h2,h3{max-width:18em;text-wrap:balance}
.hero h1{max-width:14em}
p,li,dd{text-wrap:pretty}
/* 가운데 정렬 문맥에서는 최대폭이 좌측으로 쏠리지 않게 */
.hero h1,.center h1,.center h2,h1.center,h2.center,.page-head h1,.page-head h2,.band h2,.process-head h2,.endcta h2,.mapsec h2,.final h2,.faq-cta h2{margin-inline:auto}
/* PC에서만 살리는 줄바꿈 (모바일에선 자연스럽게 흐르게) */
@media(max-width:767px){.pc-br{display:none}}
/* iOS Safari가 입력창 탭 시 확대하지 않도록 — 16px 미만 금지 */
@media(max-width:767px){input,textarea,select{font-size:16px}}

/* 헤드라인만 부리체 — 본문은 Noto Sans KR 유지 */
h1,h2{font-family:"Noto Serif KR","Noto Sans KR",serif;letter-spacing:-.02em}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:16px;letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
button{font-family:inherit;cursor:pointer}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:box-shadow .25s ease}
header.scrolled{box-shadow:0 6px 24px rgba(20,40,28,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px;max-width:1080px;margin:0 auto;padding:0 20px}
.logo{display:inline-flex;align-items:center;text-decoration:none}
.logo img{height:58px;width:auto;display:block}
@media(max-width:640px){.logo img{height:48px}}
.nav a.link{font-size:14.5px;font-weight:500;color:var(--ink);text-decoration:none;margin-left:22px}
.nav a.link:hover{color:var(--green)}
.nav a.link.on{color:var(--green);font-weight:700}
.nav a.btn-nav{background:var(--green);color:#fff;font-weight:700;padding:9px 20px;border-radius:999px;box-shadow:0 2px 8px rgba(18,48,35,.15);transition:.2s}
.nav a.btn-nav:hover{color:#fff;background:var(--green-dark);transform:translateY(-1px)}
@media(max-width:700px){.nav a.link:not(.keep){display:none}}

/* 모바일 햄버거 메뉴 */
.hamburger{display:none;width:44px;height:44px;border:0;background:none;align-items:center;justify-content:center;margin-left:10px;padding:0}
.hamburger svg{width:24px;height:24px;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
@media(max-width:700px){.hamburger{display:inline-flex}}
.nav-overlay{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:80;opacity:0;transition:opacity .25s ease}
.nav-overlay.show{opacity:1}
.mobile-nav{position:fixed;top:0;right:0;bottom:0;width:min(82vw,320px);background:#fff;z-index:81;
  padding:20px 22px calc(24px + env(safe-area-inset-bottom));transform:translateX(100%);
  transition:transform .28s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;overflow-y:auto;
  box-shadow:-8px 0 30px rgba(10,25,16,.18)}
.mobile-nav.show{transform:none}
.mnav-close{align-self:flex-end;width:44px;height:44px;border:0;background:none;padding:0;margin-bottom:6px}
.mnav-close svg{width:22px;height:22px;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.mobile-nav a.mitem{display:flex;align-items:center;min-height:52px;font-size:17px;font-weight:700;
  color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.mobile-nav a.mitem:active{color:var(--green)}
.mnav-contact{margin-top:auto;padding-top:20px}
.mnav-contact a{display:flex;align-items:center;gap:9px;min-height:48px;font-size:14.5px;font-weight:600;
  color:var(--gray);text-decoration:none;word-break:break-all}
.mnav-contact svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mnav-contact a:last-child svg{stroke:none;fill:currentColor}
@media(prefers-reduced-motion:reduce){.mobile-nav,.nav-overlay{transition:none}}



.page-head{padding-top:56px;padding-bottom:0;text-align:center}
.page-head h1{font-size:clamp(28px,4.5vw,42px);font-weight:800;letter-spacing:-.03em}

main{padding:28px 0 100px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 8px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 20px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;transition:.15s}
.tab:hover{border-color:var(--green);color:var(--green)}
.tab.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
@media(max-width:640px){.tabs{overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto}}

.gsec{padding:56px 0 8px;scroll-margin-top:90px}
.gsec h2{font-size:clamp(24px,3vw,30px);margin:0 0 22px;max-width:none}
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 20px;align-items:start}
@media(max-width:860px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.ggrid{grid-template-columns:minmax(0,1fr)}}
.gcard{display:flex;flex-direction:column;gap:4px;min-width:0;padding:0;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:zoom-in}
.gimg{position:relative;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:var(--radius-media,4px);background:var(--bg-soft);margin-bottom:8px}
.gimg img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.gcard:hover .gimg img{transform:scale(1.03)}
.gcard:focus-visible{outline:2px solid var(--green);outline-offset:4px}
.gcount{position:absolute;right:10px;bottom:10px;padding:3px 10px;border-radius:999px;background:rgba(17,24,20,.72);color:#fff;font-size:12.5px;font-weight:700}
.gtitle{font-size:18px;font-weight:700;line-height:1.4}
.gtitle.plain{font-size:16px;font-weight:500}
.gmeta{font-size:13.5px;color:var(--gray)}
@media(prefers-reduced-motion:reduce){.gimg img{transition:none}}

.faq-cta{text-align:center;margin-top:72px;padding:34px 24px;background:var(--bg-soft)}
.faq-cta h2{font-size:19px;font-weight:800;font-family:'Noto Sans KR',sans-serif;letter-spacing:inherit}
.faq-cta p{color:var(--gray);font-size:14.5px;margin-top:6px}
.faq-cta a{display:inline-block;margin-top:16px;background:var(--kakao);color:#191919;text-decoration:none;font-weight:800;font-size:15px;padding:13px 28px;border-radius:999px}

.glb{position:fixed;inset:0;z-index:120;background:rgba(10,16,12,.94);color:#fff;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"prev fig next";align-items:center;gap:16px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.glb[hidden]{display:none}
.glb figure{grid-area:fig;margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.glb img{display:block;max-width:100%;max-height:calc(100vh - 190px);width:auto;height:auto;border-radius:4px}
.glb figcaption{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.glb .lt{font-family:"Noto Serif KR","Noto Sans KR",serif;font-size:19px;font-weight:700}
.glb .le{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;opacity:.7;margin-left:6px}
.glb .ld{font-size:14.5px;max-width:34em;opacity:.92}
.glb .lm{font-size:13px;opacity:.72}
.glb .nav-b{width:52px;height:52px;border-radius:999px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.08);color:#fff;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.glb .nav-b:hover:not(:disabled){background:var(--green);border-color:var(--green)}
.glb .nav-b:disabled{opacity:.25;cursor:default}
.glb .nav-b[hidden]{display:none}
.glb .prev{grid-area:prev}.glb .next{grid-area:next}
.glb .close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:calc(env(safe-area-inset-right) + 14px);border:1px solid rgba(255,255,255,.7);background:none;color:#fff;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:500;cursor:pointer}
@media(max-width:640px){.glb{grid-template-columns:1fr 1fr;grid-template-areas:"fig fig" "prev next";align-content:center;row-gap:20px}.glb .prev{justify-self:end;margin-right:12px}.glb .next{justify-self:start;margin-left:12px}}

/* 푸터 사업자 정보 — 모바일에선 세로 스택(구분자 숨김) */
footer .biz{display:flex;flex-wrap:wrap;gap:0}
footer .biz .sep{color:var(--line)}
@media(max-width:767px){footer .biz{flex-direction:column;gap:4px}footer .biz .sep{display:none}}
footer{padding:48px 0;font-size:13px;color:var(--gray)}
footer .wrap{max-width:1080px}
footer .foot-logo{height:42px;margin-bottom:14px;display:block}
footer a{color:var(--gray);text-decoration:none;font-weight:700}

.chat-fab{position:fixed;right:18px;bottom:20px;z-index:65;display:flex;align-items:center;gap:8px;background:var(--kakao);color:#191919;text-decoration:none;font-weight:800;font-size:14.5px;padding:13px 18px 13px 15px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.22);transition:.2s}
.chat-fab:hover{transform:translateY(-2px)}
.chat-fab svg{width:22px;height:22px}
@media(max-width:640px){.chat-fab{padding:14px;bottom:calc(16px + env(safe-area-inset-bottom))}.chat-fab .lbl{display:none}}

/* ── 스크롤 등장 ──────────────────────────────────────────────────────
   화면에 들어온 항목부터 하나씩 나타납니다. 스크롤을 가로채지 않으므로
   모바일 주소창이 접혔다 펴져도, 카톡 인앱 브라우저에서도 어긋나지 않습니다.
   data-reveal은 JS가 붙입니다 — JS가 없거나 실패하면 처음부터 전부 보입니다.
   transform·opacity만 바꿔 레이아웃 계산 없이 그려집니다. */
[data-reveal]{opacity:0;transform:translate3d(0,16px,0);
  transition:opacity .5s ease var(--rd,0ms),transform .55s cubic-bezier(.22,.61,.36,1) var(--rd,0ms)}
[data-reveal].in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){[data-reveal],[data-reveal].in{opacity:1;transform:none;transition:none}}

<script>
// 모바일 메뉴 — 열기/닫기 + 접근성(ESC·포커스 트랩·스크롤 잠금)
(function(){
  var btn=document.getElementById('navToggle'),panel=document.getElementById('mobileNav'),
      ov=document.getElementById('navOverlay'),closeBtn=document.getElementById('navClose');
  if(!btn||!panel||!ov)return;
  var lastFocus=null;
  function items(){return panel.querySelectorAll('a[href],button:not([disabled])');}
  function onKey(e){
    if(e.key==='Escape'){close();return;}
    if(e.key!=='Tab')return;
    var f=[].slice.call(items()); if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
  function open(){
    lastFocus=document.activeElement;
    panel.hidden=false;ov.hidden=false;
    requestAnimationFrame(function(){panel.classList.add('show');ov.classList.add('show');});
    btn.setAttribute('aria-expanded','true');
    btn.setAttribute('aria-label','메뉴 닫기');
    document.body.style.overflow='hidden';
    var f=items(); if(f.length)f[0].focus();
    document.addEventListener('keydown',onKey);
  }
  function close(){
    panel.classList.remove('show');ov.classList.remove('show');
    btn.setAttribute('aria-expanded','false');
    btn.setAttribute('aria-label','메뉴 열기');
    document.body.style.overflow='';
    document.removeEventListener('keydown',onKey);
    setTimeout(function(){panel.hidden=true;ov.hidden=true;},280);
    // 닫으면 항상 햄버거 버튼으로 포커스 복귀 (키보드 사용자 위치 유지)
    if(btn&&btn.focus)btn.focus(); else if(lastFocus&&lastFocus.focus)lastFocus.focus();
  }
  btn.addEventListener('click',open);
  ov.addEventListener('click',close);
  if(closeBtn)closeBtn.addEventListener('click',close);
  [].forEach.call(panel.querySelectorAll('a'),function(a){a.addEventListener('click',close);});
})();
</script>
